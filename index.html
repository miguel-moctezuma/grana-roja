<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1b1008">
<link rel="manifest" href="manifest.webmanifest">
<title>Aremi’s Cozy Christmas Tree</title>
<link rel="preload" as="image" href="img/panorama-fondo.jpg">
<style>
:root{
  --nogal:#4a2e1b; --miel:#c98b3c; --crema:#f6ead2; --madera:#7a4a2a; --noche:#14203a; --brasa:#e8742c;
  --dorado:#c9a24a; --vino:#6e1f2b; --bosque:#1f4a35; --kraft:#b98f5f;
  --fuente:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Nunito",system-ui,sans-serif;
  --serif:Georgia,"Times New Roman",serif;

  /* Geometría de la escena: la ilustración (1170×2526) siempre CUBRE la pantalla, sin bandas.
     --vh usa dvh (altura real visible en Safari) y cae a vh en navegadores viejos. */
  --vh:1vh;
  --ancho-sala:min(100vw, calc(var(--vh) * 62));        /* en celular = ancho completo; en pantalla ancha = columna */
  --ancho-escena:max(var(--ancho-sala), calc(var(--vh) * 46.32));
  --anclaje:70%;                                          /* qué parte del recorte vertical se pierde arriba (techo) */
}
@supports (height:100dvh){ :root{ --vh:1dvh } }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#1b1008;color:var(--crema);font-family:var(--fuente);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- Bienvenida y acceso ---------- */
#bienvenida{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;background:radial-gradient(circle at 50% 40%,#3a2314,#150c06);transition:opacity .9s ease;padding:env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom)}
#bienvenida.fuera{opacity:0;pointer-events:none}
#bienvenida h1{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:600;letter-spacing:.01em}
#acceso{display:none;gap:.6rem;width:min(18rem,100%)}
#acceso.ver{display:flex}
#acceso input{flex:1;min-width:0;padding:.7rem .9rem;border-radius:.8rem;border:1px solid var(--miel);background:rgba(246,234,210,.1);color:var(--crema);font:inherit;font-size:16px}
#acceso button{padding:.7rem 1rem;border-radius:.8rem;background:var(--miel);color:#2a1808;font-weight:600}
#errorAcceso{min-height:1.2em;font-size:.9rem;color:#f0b9a0}

/* ---------- Sala ---------- */
#sala{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:var(--ancho-sala);overflow:hidden;background:#1b1008}
#sala[hidden]{display:none}

/* Panorama: tres zonas, desplazamiento horizontal táctil. */
#panScroll{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}
#panScroll::-webkit-scrollbar{display:none}
#panTrack{position:relative;width:calc(var(--ancho-escena) * 3);height:100%;min-width:300%}
#escena{position:absolute;left:0;top:var(--anclaje);width:100%;height:calc(var(--ancho-escena) * 2526 / 1170);transform:translateY(calc(var(--anclaje) * -1))}
#fondo{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.zona-snap{position:absolute;top:0;bottom:0;width:33.333333%;scroll-snap-align:center;pointer-events:none}
#navegacion{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 1rem);left:50%;transform:translateX(-50%);display:flex;gap:.7rem;align-items:center;z-index:9;padding:.5rem .7rem;background:rgba(27,16,8,.62);border-radius:2rem;backdrop-filter:blur(6px)}
#navegacion button{width:44px;height:44px;display:grid;place-items:center;touch-action:manipulation}
#navegacion button::before{content:"";width:8px;height:8px;border-radius:50%;background:#d9b989;opacity:.55;transition:transform .2s,opacity .2s}
#navegacion button.activo::before{transform:scale(1.6);opacity:1;background:#fff0d2}
/* Ventana: nieve y Santa visibles a través de los dos cristales */
#ventana{
  position:absolute;left:25.8%;top:39.6%;width:19.3%;height:14.6%;
  overflow:hidden;pointer-events:none;
  mask-image:linear-gradient(to right,#000 0 47%,transparent 47% 55%,#000 55% 100%);
}
.nieve,.nieve::before,.nieve::after{position:absolute;inset:0}
.nieve::before,.nieve::after{
  content:"";background-repeat:repeat;
  animation:nevar var(--duracion) linear infinite;
}
.nieve::before{
  --duracion:18s;--deriva:43px;--caida:146px;
  opacity:.62;background-size:43px 73px;
  background-image:
    radial-gradient(circle at 12px 16px,#fff 0 1px,transparent 1.6px),
    radial-gradient(circle at 34px 50px,#e8f2ff 0 .65px,transparent 1.2px);
}
.nieve::after{
  --duracion:28s;--deriva:61px;--caida:194px;
  opacity:.8;background-size:61px 97px;
  background-image:
    radial-gradient(circle at 44px 24px,#fff 0 1.45px,transparent 2.2px),
    radial-gradient(circle at 14px 76px,#fff 0 .8px,transparent 1.4px);
}
@keyframes nevar{to{background-position:var(--deriva) var(--caida)}}

/* ---------- Objetos decorativos ---------- */
.obj{position:absolute;display:none;line-height:0;user-select:none}
.obj.hay{display:block}
.obj img{display:block;width:100%;height:auto;pointer-events:none}
.obj.nuevo{animation:aparece 1.6s ease both}
.obj.fundir.nuevo{animation:fundir 1.6s ease both}
@keyframes aparece{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fundir{from{opacity:0}to{opacity:1}}

#o1{left:0;top:16.4%;width:100%;height:8.3%;pointer-events:none}
#o1.hay{display:flex}
#o1 img{flex:0 0 33.333333%;width:33.333333%;height:100%;object-fit:fill}
#o2{left:75.1%;top:25.8%;width:9%}
#o3{left:23.8%;top:32.1%;width:24%;mix-blend-mode:screen;pointer-events:none}
#o3 img{animation:titila 3.2s ease-in-out infinite}
@keyframes titila{50%{opacity:.6}}
#o4,#o5,#o6{left:50%;bottom:34%;width:13%}
#escena:has(#o6.hay) :is(#o4,#o5){visibility:hidden}
#o7{left:76.7%;bottom:36.3%;width:6%;transform-origin:50% 100%}
#o7 img{position:relative;transform-origin:50% 100%;animation:llama 1.7s ease-in-out infinite}
@keyframes llama{0%,100%{transform:scale(1,1)}35%{transform:scale(.97,1.05)}70%{transform:scale(1.02,.98)}}
.brillo{position:absolute;left:-110%;right:-110%;top:-45%;bottom:-25%;background:radial-gradient(ellipse at 50% 70%,rgba(255,170,70,.55),rgba(255,120,30,.2) 45%,transparent 70%);animation:brillo 2.6s ease-in-out infinite;pointer-events:none}
@keyframes brillo{50%{opacity:.7}}
#o8{left:69.5%;top:45%;width:19%;transform-origin:50% 0;pointer-events:none}
#o8 img{position:absolute;top:0;width:24%;height:auto}
#o8 img:first-child{left:0;transform:scaleX(-1)}
#o8 img:last-child{right:0}
#o9{left:21.675%;bottom:28.5%;width:6.65%;transform-origin:50% 100%}

/* ---------- Contador ---------- */
#contador{position:absolute;right:4%;top:calc(env(safe-area-inset-top) + 1.4%);padding:.5rem .8rem;border-radius:.6rem;background:rgba(74,46,27,.88);border:1px solid var(--miel);text-align:center;font-family:var(--serif);color:var(--crema);font-size:.7rem;opacity:.9;z-index:8}
#contador b{margin-top:.15rem;font-size:.95rem;font-weight:600;color:var(--dorado);font-variant-numeric:tabular-nums}

/* ---------- Letrero ---------- */
#letrero{position:absolute;left:50%;top:44%;transform:translateX(-50%);max-width:82%;padding:.9rem 1.3rem;border-radius:1.2rem;background:rgba(246,234,210,.88);color:var(--nogal);text-align:center;font-weight:600;font-size:1.05rem;box-shadow:0 .3rem 1.2rem rgba(0,0,0,.3);opacity:0;pointer-events:none;z-index:10}
#letrero{transition:opacity .25s ease}
#letrero.ver{opacity:1}

/* ---------- Santa (cruza la ventana el 1 de diciembre) ---------- */
#santa{position:absolute;left:0;top:0;width:70%;display:none;line-height:0}
#santa img{display:block;width:100%;height:auto;filter:brightness(.4)}
#santa.vuela{display:block;animation:vuelo 7s ease-in-out both}
@keyframes vuelo{from{transform:translate(-105%,130%)}to{transform:translate(150%,15%)}}

/* ---------- Regalos (PNG) ---------- */

/* Pila decorativa integrada en el panorama */
#pila{position:absolute;left:48%;bottom:28%;width:18%;min-height:44px;z-index:7;display:none;filter:drop-shadow(0 9px 7px rgba(20,8,2,.5));transform-origin:center bottom}
#pila.ver{display:block}
#pila img{width:100%;height:auto;display:block;pointer-events:none}
#pilaDisponibles{
  position:absolute;left:50%;bottom:calc(100% + .3rem);transform:translateX(-50%);
  width:max-content;padding:.32rem .6rem;border:1px solid #d7a96e;border-radius:1rem;
  background:#68252e;color:#fff2d9;box-shadow:0 2px 6px #1e0c0870;
  font:600 .72rem/1.15 var(--fuente);pointer-events:none;
}
#pilaDisponibles::after{
  content:"";position:absolute;left:50%;bottom:-4px;width:6px;height:6px;
  transform:translateX(-50%) rotate(45deg);background:#68252e;
  border-right:1px solid #d7a96e;border-bottom:1px solid #d7a96e;
}
#pila.disponible{animation:respiraPila 2.8s ease-in-out infinite}
@keyframes respiraPila{50%{filter:drop-shadow(0 0 16px rgba(255,202,96,.85));transform:translateY(-4px)}}
/* Vista ampliada de los regalos */
#zoomRegalos{
  position:fixed;inset:0;z-index:18;display:none;flex-direction:column;align-items:center;
  background:linear-gradient(#170b09dd,#41241db0 58%,#1b1008cc),url('img/piso-zoom.jpg') center/cover #321408;
  overscroll-behavior:contain;
}
#zoomRegalos.ver{display:flex}
#zoomCabecera{
  width:100%;flex:none;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:calc(env(safe-area-inset-top) + .75rem) max(1rem,env(safe-area-inset-right)) .75rem max(1rem,env(safe-area-inset-left));
  background:linear-gradient(110deg,#4f2029,#2c1318);border-bottom:1px solid #9a6a42;
  box-shadow:0 .3rem 1rem #18090970;
}
#zoomCabecera h2{font:600 clamp(1.4rem,5vw,2rem)/1.1 var(--serif)}
#zoomCabecera p{margin-top:.25rem;color:#f3d3a4;font-size:.82rem}
#cerrarZoom{
  flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #bd9160;
  background:#301919;color:#ffe7ba;font-size:1.6rem;line-height:1;
}
#zoomScroll{
  width:100%;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;
  padding:1.1rem max(.75rem,env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) max(.75rem,env(safe-area-inset-left));
}
#regalos{
  --columnas:3;display:grid;grid-template-columns:repeat(var(--columnas),minmax(0,1fr));
  gap:clamp(.4rem,2.2vw,1rem);width:min(100%,48rem);margin:auto;
}
@media(min-width:550px){#regalos{--columnas:4}}
.regalo{
  position:relative;display:grid;grid-template-rows:minmax(0,1fr);justify-items:center;
  align-items:end;aspect-ratio:.88;padding:.5rem .2rem .45rem;min-height:104px;
  background:radial-gradient(ellipse at 50% 82%,#9c633849 0%,transparent 55%),linear-gradient(155deg,#503025,#291711);
  border:1px solid #ba89586e;border-bottom:4px solid #a66a3e;border-radius:.85rem .85rem .4rem .4rem;
  box-shadow:inset 0 1px #ffda9a2b,0 .3rem .55rem #180a0780;
}
.regalo img{
  width:min(96%,calc(100% * var(--f) * 8));height:100%;min-height:0;
  object-fit:contain;object-position:center bottom;pointer-events:none;
  filter:drop-shadow(0 .24rem .2rem #14080590);
}
.regalo img.a{width:min(100%,calc(100% * var(--f) * 8 * var(--k)))}
.regalo:focus-visible,#pila:focus-visible,#cerrarZoom:focus-visible{outline:3px solid #fff0c5;outline-offset:2px}
#avisoZoom{
  position:absolute;bottom:calc(env(safe-area-inset-bottom) + .85rem);left:50%;transform:translateX(-50%);z-index:2;
  width:max-content;max-width:calc(100% - 2rem);padding:.6rem .95rem;border-radius:.6rem;
  background:var(--crema);color:var(--nogal);font-weight:600;text-align:center;opacity:0;pointer-events:none;
}
#avisoZoom.ver{opacity:1}
.regalo.vibra{animation:vibra .45s}
@keyframes vibra{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.regalo.deshace{animation:deshace 1.1s ease forwards}
@keyframes deshace{to{transform:scale(1.25) rotate(4deg);opacity:0}}

/* ---------- Revelación y Polaroid ---------- */
.velo{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(10,5,2,.72)}
.velo.ver{display:flex}
#veloCaja{padding:1.5rem}
#caja{animation:aparece .5s ease both}
#etiqueta{overflow-wrap:anywhere;font:600 clamp(1.65rem,8vw,2.65rem)/1.1 var(--serif)}
#papelito{margin-top:.7rem;color:#694530;font:italic 1.08rem var(--serif)}
#polaroid{width:min(17rem,78vw);padding:.8rem .8rem 1rem;background:#fbf8f0;color:#3a2a1a;text-align:center;font-family:var(--serif);transform:rotate(-2deg);box-shadow:0 .5rem 1.6rem rgba(0,0,0,.45)}
#polaroid .foto{aspect-ratio:1;background:#d9d1c1;overflow:hidden}
#polaroid img{width:100%;height:100%;object-fit:cover;display:block}
#polaroid p{margin-top:.7rem;font-size:1.05rem}

#aviso{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 3%);transform:translateX(-50%);z-index:20;padding:.6rem 1rem;border-radius:1rem;background:rgba(246,234,210,.92);color:var(--nogal);font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center}
#aviso.ver{opacity:1}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.01s !important}
}
/* ---------- Etiqueta de bienvenida ---------- */
#bienvenida{
  padding:calc(env(safe-area-inset-top) + 1rem) max(1rem,env(safe-area-inset-right))
    calc(env(safe-area-inset-bottom) + 1rem) max(1rem,env(safe-area-inset-left));
  background:radial-gradient(ellipse,#081c0e18 25%,#08170bb0),url('img/papel-navidad.jpg') center / cover;
  overflow:auto;
}
.etiquetaRegalo{
  position:relative;width:min(100%,23rem);margin:auto;
  padding:2.4rem clamp(1rem,5vw,1.7rem) 1.25rem;text-align:center;
  isolation:isolate;border:1px solid #dbb979;border-radius:1.35rem 1.35rem .65rem .65rem;
  color:var(--vino);background:radial-gradient(ellipse at 50% 12%,#fff8e7,#efdbb2);
  box-shadow:0 0 0 3px #68252e,0 .65rem 2rem #100b07a8;
}
.etiquetaRegalo::before{
  content:"";position:absolute;top:-1rem;left:50%;width:1rem;height:2.4rem;
  transform:translateX(-50%) rotate(13deg);border:4px solid #9e202b;border-radius:50%;
  box-shadow:inset 1px 0 #e37967,1px 1px 2px #53221570;
}
.etiquetaRegalo::after{
  content:"";position:absolute;inset:.36rem;z-index:-1;pointer-events:none;
  border:1px solid #b1834f;border-radius:1rem 1rem .42rem .42rem;
}
#bienvenida h1{font:600 clamp(1.8rem,7.5vw,2.75rem)/1.08 var(--serif)}
#etiquetaBienvenida #acceso{margin:1rem auto 0;width:100%}
#etiquetaBienvenida #codigo{color:#391f15;background:#fff9e9;border-color:#a47648}
#etiquetaBienvenida #codigo::placeholder{color:#6f5140}
#etiquetaBienvenida #entrar{min-height:44px;background:var(--vino);color:#fff4de}
#etiquetaBienvenida #errorAcceso{margin-top:.45rem;color:#84242e}

/* ---------- Contador de solapas ---------- */
#contador{
  top:calc(env(safe-area-inset-top) + .65rem);
  right:max(.65rem,env(safe-area-inset-right));
  padding:.4rem .5rem;border-radius:.55rem;background:#34231a;
  box-shadow:0 3px 9px #170b0790;
}
#contador #contadorValor{display:grid;grid-template-columns:repeat(4,1fr);gap:.22rem}
.contadorUnidad{display:grid;justify-items:center;gap:.15rem}
.contadorFicha{
  display:block;min-width:2.1em;padding:.14em .22em;border-radius:.2em;
  background:linear-gradient(#251e19 0 48%,#120e0c 48% 53%,#3a2b21 53%);
  color:#fff2d8;box-shadow:0 2px 0 #160f0c;
  font:600 .91rem/1.25 ui-monospace,monospace;
}
.contadorUnidad small{color:#f0d1a0;font:.6rem var(--fuente)}
@media (orientation:landscape) and (max-height:500px){
  #contador{right:.65rem}
}

/* ---------- Christmas Radio ---------- */
#radioBoton{
  position:absolute;z-index:8;left:25%;bottom:41.15%;transform:translateX(-50%);
  width:5.9%;min-width:44px;min-height:44px;display:grid;align-items:end;
}
.radioCarcasa{
  display:grid;position:relative;place-items:center;width:100%;aspect-ratio:1.55;
  margin-bottom:4px;border:2px solid #d09758;border-radius:19%;
  background:linear-gradient(145deg,#865032,#3e241b 60%);
  box-shadow:0 3px 5px #1c0c06b0;
}
.radioCarcasa::after{
  content:"";position:absolute;bottom:-5px;width:72%;height:4px;
  border-inline:4px solid #392419;
}
.radioPantalla{
  display:grid;place-items:center;width:79%;height:75%;border:1px solid #ad8852;
  border-radius:23%;background:radial-gradient(ellipse,#315747,#11231d);
  color:#ffe3a2;font:700 clamp(.75rem,4vw,1.65rem) var(--serif);
}
#radioBoton:focus-visible,.radioControl:focus-visible{outline:2px solid #fff1cb;outline-offset:3px}
#radioPanel{
  position:fixed;inset:0;margin:auto;width:min(25rem,calc(100% - 2rem - env(safe-area-inset-left) - env(safe-area-inset-right)));
  max-height:calc(var(--vh) * 100 - 1.5rem - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  overflow:auto;overscroll-behavior:contain;padding:.65rem;
  border:2px solid #c59355;border-radius:1.15rem;background:linear-gradient(135deg,#75462d,#3a2218);
  color:var(--crema);box-shadow:0 .8rem 2.5rem #130904bb;
}
#radioPanel::backdrop{background:#140b06b0}
#radioPanel[open]{animation:radioAmpliar .24s ease-out both}
@keyframes radioAmpliar{from{transform:scale(.72);opacity:.35}to{transform:scale(1);opacity:1}}
.radioCabecera{display:flex;align-items:center;justify-content:space-between;gap:.4rem;padding:0 0 .45rem .25rem}
.radioCabecera h2{font:600 1.05rem var(--serif)}
.radioControl{
  display:grid;place-items:center;flex:none;width:44px;height:44px;border:1px solid #b78451;
  border-radius:50%;background:#38251b;color:#ffe5bb;font:1.45rem/1 var(--serif);
}
.radioMarco{padding:5px;border:1px solid #c2965d;border-radius:.85rem;background:#181411}
.radioMarco iframe{display:block;width:100%;border:0;border-radius:.55rem}
#radioPanel::after{
  content:"";display:block;width:34%;height:.28rem;margin:.55rem auto 0;border-radius:1em;
  background:repeating-linear-gradient(90deg,#241711 0 2px,#a26945 2px 4px);
}
#activarAvisos{
  min-height:44px;margin-top:.4rem;padding:.25rem .4rem;
  border:1px solid var(--miel);border-radius:.5rem;background:#54242c;color:var(--crema);
  font:600 .72rem var(--fuente);
}
#estadoAvisos{max-width:10rem;line-height:1.3}
</style>
</head>
<body>

<div id="bienvenida">
  <div id="etiquetaBienvenida" class="etiquetaRegalo">
    <h1>Feliz Navidad,<br>te amo cosi</h1>
    <form id="acceso" onsubmit="return false">
      <input id="codigo" type="password" autocomplete="off" autocapitalize="off" aria-label="Código de acceso" placeholder="Código de acceso">
      <button id="entrar" type="button">Entrar</button>
    </form>
    <p id="errorAcceso" role="alert"></p>
  </div>
</div>

<main id="sala" hidden>
  <div id="panScroll" aria-label="Recorrer la cabaña horizontalmente">
   <div id="panTrack">
    <div class="zona-snap" style="left:0"></div><div class="zona-snap" style="left:33.333333%"></div><div class="zona-snap" style="left:66.666667%"></div>
    <div id="escena">
    <img id="fondo" src="img/panorama-fondo.jpg" alt="" decoding="async">

    <div id="ventana"><div class="nieve"></div><div id="santa"><img src="img/santa.png" alt=""></div></div>

    <!-- Nueve objetos, uno por día del 21 al 29 de nov. -->
    <div class="obj fundir" id="o1" data-n="1" aria-label="Guirnalda"><img src="img/obj-1-guirnalda.png" alt=""><img src="img/obj-1-guirnalda.png" alt=""><img src="img/obj-1-guirnalda.png" alt=""></div>
    <div class="obj" id="o2" data-n="2" aria-label="Corona navideña"><img src="img/obj-2-corona.png" alt=""></div>
    <div class="obj fundir" id="o3" data-n="3" aria-label="Luces cálidas"><img src="img/Warm%20Glowing%20Bulb%20Garland.png" alt=""></div>
    <div class="obj fundir" id="o4" data-n="4" aria-label="Pino navideño"><img src="img/obj-4-pino.png" alt=""></div>
    <div class="obj fundir" id="o5" data-n="5" aria-label="Esferas"><img src="img/obj-5-pino-con-esferas.png" alt=""></div>
    <div class="obj fundir" id="o6" data-n="6" aria-label="Estrella"><img src="img/Festive%20Glowing%20Christmas%20Tree.png" alt=""></div>
    <div class="obj" id="o7" data-n="7" aria-label="Chimenea encendida"><i class="brillo"></i><img src="img/obj-7-fuego.png" alt=""></div>
    <div class="obj" id="o8" data-n="8" aria-label="Calcetines navideños"><img src="img/calcetin-rojo.png" alt=""><img src="img/calcetin-rojo.png" alt=""></div>
    <div class="obj" id="o9" data-n="9" aria-label="Regalo decorativo"><img src="img/obj-9-regalo-decorativo.png" alt=""></div>

      <span class="radioCarcasa" aria-hidden="true"><span class="radioPantalla">♫</span></span>

    </div>
   </div>
  </div>
  <nav id="navegacion" aria-label="Zonas de la cabaña"><button type="button" data-zona="0" aria-label="Ir al sofá"></button><button type="button" data-zona="1" aria-label="Ir al pino"></button><button type="button" data-zona="2" aria-label="Ir a la chimenea"></button></nav>


  <div id="contador" aria-live="off"><span id="contadorTexto">Días para Navidad</span><b id="contadorValor" role="timer" aria-label="Tiempo para Navidad">
    <span class="contadorUnidad" aria-hidden="true"><span class="contadorFicha">00</span><small>días</small></span>
    <span class="contadorUnidad" aria-hidden="true"><span class="contadorFicha">00</span><small>h</small></span>
    <span class="contadorUnidad" aria-hidden="true"><span class="contadorFicha">00</span><small>min</small></span>
    <span class="contadorUnidad" aria-hidden="true"><span class="contadorFicha">00</span><small>s</small></span>
  </b>
  <button id="activarAvisos" type="button" hidden>Avísame cuando haya un regalo</button>
  <p id="estadoAvisos" role="status"></p>
  </div>
  <div id="letrero">Lemito se chifló y se robó una cabaña jejeje</div>
  <div id="aviso" role="status"></div>
</main>

<dialog id="radioPanel" aria-labelledby="radioTitulo">
  <header class="radioCabecera">
    <h2 id="radioTitulo">Christmas Radio</h2>
    <button id="radioCerrar" class="radioControl" type="button" aria-label="Cerrar Christmas Radio" autofocus>×</button>
  </header>
  <div class="radioMarco">
    <iframe title="Christmas Radio en Spotify"
      src="https://open.spotify.com/embed/playlist/37i9dQZF1DX0Yxoavh5qJV?utm_source=generator&amp;theme=0&amp;si=9531eb70af984623"
      width="100%" height="152" loading="lazy" allowfullscreen
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
  </div>
</dialog>

<section id="zoomRegalos" role="dialog" aria-modal="true" aria-labelledby="tituloRegalos">
  <header id="zoomCabecera">
    <div><h2 id="tituloRegalos">Tus regalos</h2><p>Uno al día, chifis</p></div>
    <button id="cerrarZoom" type="button" aria-label="Cerrar regalos">×</button>
  </header>
  <div id="zoomScroll"><div id="regalos" aria-label="Regalos"></div></div>
  <div id="avisoZoom" role="status"></div>
</section>

<div class="velo" id="veloCaja">
  <div id="caja" class="etiquetaRegalo"><div id="etiqueta"></div><div id="papelito">Espero tu review :p</div></div>
</div>
<div class="velo" id="veloPolaroid">
  <div id="polaroid"><div class="foto"><img id="polaroidImg" alt=""></div><p id="polaroidFecha"></p></div>
</div>

<script>
(function(){
"use strict";

/* ===== Configuración ===== */
const API = "https://grana-roja-api.jmiguel-moctezuma.workers.dev";
const INICIO_DECORACION = "2026-11-21";
const FECHA_SANTA = "2026-12-01";
const PRIMER_DIA_REGALOS = "2026-12-02";
const NAVIDAD = new Date("2026-12-25T00:00:00-06:00");   // medianoche en Monterrey
const TEXTO_CONTADOR = "Días para Navidad";             // TODO: texto posterior al 1 de diciembre (pendiente)
const TOTAL = 24;

/* ===== Utilidades ===== */
const $ = id => document.getElementById(id);
const guardar = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const leer = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const borrar = k => { try{ localStorage.removeItem(k); }catch(e){} };
const esperar = ms => new Promise(r => setTimeout(r, ms));

let acceso = leer("gr_acceso") || "";
let estado = null;          // { fecha, dia, regalos:{ idRegalo: diaApertura } }
let ocupado = false;

/* ===== Imágenes: se cargan mientras se ve la bienvenida, para que la sala aparezca completa ===== */
const COLORES = ["bosque","vino","kraft","marfil"];
// f conserva la escala relativa de cada forma de regalo
const FORMAS  = [{n:"alto",f:.09},{n:"cubo",f:.112},{n:"ancho",f:.138}];
// k = cuánto más ancha se dibuja la imagen abierta para que la caja mida lo mismo que cerrada
const ESCALA_ABIERTO = {
  "bosque-alto":1.19,"bosque-ancho":1.068,"bosque-cubo":1.168,
  "vino-alto":1.252,"vino-ancho":1.112,"vino-cubo":1.192,
  "kraft-alto":1.078,"kraft-ancho":1.084,"kraft-cubo":1.126,
  "marfil-alto":1.139,"marfil-ancho":1.134,"marfil-cubo":1.166
};
const precargar = urls => Promise.all(urls.map(u => new Promise(res => {
  const i = new Image(); i.onload = i.onerror = () => res(); i.src = u;
})));
const fondoListo = precargar(["img/panorama-fondo.jpg", "img/monton-regalos.png", "img/piso-zoom.jpg"]);
const regalosListos = fondoListo.then(() => {
  const l = [];
  COLORES.forEach(c => FORMAS.forEach(f => { l.push("img/regalo-cerrado-"+c+"-"+f.n+".png"); l.push("img/regalo-abierto-"+c+"-"+f.n+".png"); }));
  return precargar(l);
});

async function llamar(ruta, extra){
  const r = await fetch(API + ruta, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(Object.assign({acceso}, extra||{}))
  });
  return r.json();
}

function aviso(texto, ms){
  const a = $("zoomRegalos").classList.contains("ver") ? $("avisoZoom") : $("aviso");
  a.textContent = texto;
  a.classList.add("ver");
  setTimeout(() => a.classList.remove("ver"), ms || 2600);
}

/* ===== Acceso ===== */
async function validar(){
  $("errorAcceso").textContent = "";
  try{
    const e = await llamar("/estado");
    if(!e.ok){ throw new Error(e.reason || "error"); }
    estado = e;
    guardar("gr_acceso", acceso);
    return true;
  }catch(err){
    if(String(err.message) === "acceso"){
      borrar("gr_acceso");
      $("errorAcceso").textContent = "Código incorrecto.";
    }else{
      $("errorAcceso").textContent = "No hay conexión con el servidor. Intenta de nuevo.";
    }
    return false;
  }
}

// Espera a que el fondo esté listo (máx. 6 s para no quedarse atorado si una imagen falla)
const sceneLista = () => Promise.race([fondoListo, esperar(6000)]);

async function iniciar(){
  const minimo = esperar(2200);
  if(acceso){
    const ok = await validar();
    if(ok){ await minimo; await sceneLista(); return entrarSala(); }
  }
  $("acceso").classList.add("ver");
  $("codigo").focus();
}

$("entrar").addEventListener("click", async () => {
  acceso = $("codigo").value.trim();
  if(!acceso) return;
  if(await validar()){ await sceneLista(); entrarSala(); }
});
$("codigo").addEventListener("keydown", e => { if(e.key === "Enter") $("entrar").click(); });

/* ===== Navegación del panorama ===== */
function configurarPanorama(){
  const sc = $("panScroll");
  const botones = Array.from(document.querySelectorAll("#navegacion button"));
  const paso = () => sc.scrollWidth / 3;
  const ir = (n, suave=true) => sc.scrollTo({left:Math.max(0, paso()*(n+.5)-sc.clientWidth/2),behavior:suave?"smooth":"instant"});
  const actualizar = () => {
    const zona = Math.max(0,Math.min(2,Math.round((sc.scrollLeft+sc.clientWidth/2)/paso()-.5)));
    botones.forEach((b,i)=>{b.classList.toggle("activo",i===zona);b.setAttribute("aria-current",i===zona?"true":"false");});
  };
  botones.forEach((b,i)=>b.addEventListener("click",()=>ir(i)));
  sc.addEventListener("scroll",actualizar,{passive:true});
  window.addEventListener("resize",()=>{actualizar();});
  requestAnimationFrame(()=>{ir(1,false);actualizar();});
}

/* ===== Sala: etapa según la fecha del servidor ===== */
function diasDesde(base, fecha){
  return Math.floor((Date.parse(fecha) - Date.parse(base)) / 86400000);
}

function entrarSala(){
  $("sala").hidden = false;
  $("bienvenida").classList.add("fuera");
  configurarPanorama();
  pintarSala();
  iniciarContador();
  prepararAvisos();
}

function pintarSala(){
  const f = estado.fecha;

  // Objetos decorativos: 1 por día del 21 al 29 de noviembre; después quedan todos
  const n = f < INICIO_DECORACION ? 0 : Math.min(9, diasDesde(INICIO_DECORACION, f) + 1);
  document.querySelectorAll(".obj").forEach(o => {
    const k = Number(o.dataset.n);
    o.classList.toggle("hay", k <= n);
    const visto = leer("gr_obj_" + k);
    if(k <= n && !visto){ o.classList.add("nuevo"); guardar("gr_obj_" + k, "1"); }
  });

  // Letrero de la primera visita (una sola vez)
  if(f >= INICIO_DECORACION && !leer("gr_letrero_bienvenida")){
    // Deja que se desvanezca la bienvenida antes de mostrar el letrero.
    setTimeout(() => {
      const letrero = $("letrero");
      letrero.classList.add("ver");
      guardar("gr_letrero_bienvenida", "1");
      setTimeout(() => letrero.classList.remove("ver"), 6500);
    }, 950);
  }

  // Santa: solo el 1 de diciembre
  if(f === FECHA_SANTA){
    const s = $("santa");
    s.classList.add("vuela");
    setTimeout(() => s.classList.remove("vuela"), 7200);
  }

  // Regalos: desde el 2 de diciembre
  if(f >= PRIMER_DIA_REGALOS){ pintarRegalos(); $("pila").classList.add("ver"); }
}

/* ===== Regalos ===== */
// Cada regalo (1–24) tiene siempre el mismo color y forma: 12 combinaciones, cada una dos veces
function aspectoRegalo(i){
  const combo = (i * 5 + Math.floor((i - 1) / 12) * 7) % 12;
  return { color: COLORES[combo % 4], forma: FORMAS[Math.floor(combo / 4)] };
}

function abrirZoom(){
  $("zoomRegalos").classList.add("ver");
  $("zoomScroll").scrollTop = 0;
  $("cerrarZoom").focus({preventScroll:true});
}
function cerrarZoom(){
  $("zoomRegalos").classList.remove("ver");
  $("pila").focus({preventScroll:true});
}
$("pila").addEventListener("click",abrirZoom);
$("cerrarZoom").addEventListener("click",cerrarZoom);
document.addEventListener("keydown",e=>{if(e.key==="Escape" && $("zoomRegalos").classList.contains("ver")) cerrarZoom();});

function pintarRegalos(){
  const cont = $("regalos");
  cont.innerHTML = "";
  for(let i=1;i<=TOTAL;i++){
    const {color,forma} = aspectoRegalo(i);
    const abierto = !!estado.regalos[i];
    const b = document.createElement("button");
    b.type = "button";
    b.className = "regalo" + (abierto ? " abierto" : "");
    b.dataset.id = i;
    b.style.setProperty("--f",forma.f);
    b.style.setProperty("--k",ESCALA_ABIERTO[color+"-"+forma.n]);
    b.setAttribute("aria-label","Regalo " + i + (abierto ? ", abierto" : ", cerrado"));
    const img = document.createElement("img");
    img.alt = "";
    img.draggable = false;
    img.decoding = "async";
    img.className = abierto ? "a" : "c";
    img.src = "img/regalo-" + (abierto ? "abierto" : "cerrado") + "-" + color + "-" + forma.n + ".png";
    b.appendChild(img);
    b.addEventListener("click",()=>tocar(Number(b.dataset.id),b));
    cont.appendChild(b);
  }
  const abiertos = Object.keys(estado.regalos).length;
  const disponibles = estado.disponibles ?? Math.max(0, Math.min(estado.dia, TOTAL) - abiertos);
  const burbuja = $("pilaDisponibles");
  const texto = disponibles + (disponibles === 1 ? " disponible" : " disponibles");
  if(burbuja.textContent !== texto) burbuja.textContent = texto;
  $("pila").classList.toggle("disponible", disponibles > 0);
}

function fechaDeDia(dia){
  const d = new Date(Date.parse(PRIMER_DIA_REGALOS) + (dia - 1) * 86400000);
  return new Intl.DateTimeFormat("es-MX",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(d);
}

async function tocar(id, boton){
  if(ocupado) return;
  ocupado = true;
  try{
    const diaApertura = estado.regalos[id];

    // Regalo ya abierto: Polaroid solo a partir del día siguiente
    if(diaApertura){
      if(diaApertura < estado.dia) mostrarPolaroid(diaApertura);
      return;
    }

    const r = await llamar("/abrir", {regalo:id});

    if(!r.ok && r.reason === "acceso"){ borrar("gr_acceso"); location.reload(); return; }

    if(r.ok && r.codigo){
      boton.classList.add("deshace");
      await esperar(1000);
      $("etiqueta").textContent = r.codigo;
      $("veloCaja").classList.add("ver");
      await esperar(4800);
      $("veloCaja").classList.remove("ver");
      estado = await llamar("/estado");
      pintarRegalos();
      return;
    }

    if(r.ok && r.yaAbierto){ estado = await llamar("/estado"); pintarRegalos(); return; }

    // Límite diario, día futuro o cualquier otro rechazo
    boton.classList.add("vibra");
    setTimeout(() => boton.classList.remove("vibra"), 500);
    aviso("No te desesperes chifis");
  }catch(e){
    aviso("Sin conexión. Intenta de nuevo.");
  }finally{
    ocupado = false;
  }
}

function mostrarPolaroid(dia){
  const img = $("polaroidImg");
  img.style.visibility = "visible";
  img.onerror = () => { img.style.visibility = "hidden"; };
  img.src = "fotos/" + dia + ".jpg";   // fotos nombradas por día de apertura: 1.jpg … 24.jpg
  $("polaroidFecha").textContent = fechaDeDia(dia);
  $("veloPolaroid").classList.add("ver");
}
$("veloPolaroid").addEventListener("click", () => $("veloPolaroid").classList.remove("ver"));

/* ===== Contador ===== */
function iniciarContador(){
  $("contadorTexto").textContent = TEXTO_CONTADOR;
  const dos = n => String(n).padStart(2, "0");
  const contador = $("contadorValor");
  const fichas = contador.querySelectorAll(".contadorFicha");
  const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)");
  function tic(){
    let s = Math.max(0, Math.floor((NAVIDAD - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const m = Math.floor(s / 60); s %= 60;
    contador.setAttribute("aria-label", d + " días, " + h + " horas, " + m + " minutos y " + s + " segundos");
    [d, h, m, s].forEach((valor, i) => {
      const ficha = fichas[i];
      const siguiente = dos(valor);
      if(ficha.textContent === siguiente) return;
      ficha.textContent = siguiente;
      if(!reducirMovimiento.matches){
        ficha.animate(
          [{transform:"perspective(90px) rotateX(-68deg)"}, {transform:"none"}],
          {duration:230, easing:"ease-out"}
        );
      }
    });
  }
  tic();
  setInterval(tic, 1000);
}


/* ===== Avisos de regalos ===== */
async function prepararAvisos(){
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return;
  if(!matchMedia("(display-mode: standalone)").matches && navigator.standalone !== true) return;
  const boton = $("activarAvisos");
  const mensaje = $("estadoAvisos");
  let registro;
  let clave;
  try{
    const configuracion = await llamar("/avisos/clave");
    if(!configuracion.ok || typeof configuracion.clave !== "string") return;
    const base64 = configuracion.clave.replace(/-/g, "+").replace(/_/g, "/");
    clave = Uint8Array.from(atob(base64), caracter => caracter.charCodeAt(0));
    if(clave.length !== 65 || clave[0] !== 4) return;
    await navigator.serviceWorker.register("./avisos-sw.js");
    registro = await navigator.serviceWorker.ready;
  }catch{
    return;
  }

  boton.hidden = false;
  boton.addEventListener("click", async () => {
    boton.disabled = true;
    mensaje.textContent = "";
    try{
      // Se solicita directamente en respuesta al toque.
      const permiso = await Notification.requestPermission();
      if(permiso !== "granted"){
        mensaje.textContent = "Puedes permitir los avisos en los ajustes del iPhone.";
        return;
      }
      const suscripcion = await registro.pushManager.getSubscription() ||
        await registro.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:clave});
      const respuesta = await llamar("/avisos/suscribir", {suscripcion:suscripcion.toJSON()});
      if(!respuesta.ok) throw new Error("suscripción");
      boton.hidden = true;
      mensaje.textContent = "Avisos activados.";
    }catch{
      mensaje.textContent = "No se pudieron activar los avisos. Inténtalo de nuevo.";
    }finally{
      boton.disabled = false;
    }
  });
}

iniciar();
})();
</script>
<script>
(function(){
  const boton = document.getElementById("radioBoton");
  const panel = document.getElementById("radioPanel");

  boton.addEventListener("click", () => {
    panel.showModal();
    boton.setAttribute("aria-expanded", "true");
  });
  document.getElementById("radioCerrar").addEventListener("click", () => panel.close());
  panel.addEventListener("close", () => {
    boton.setAttribute("aria-expanded", "false");
    boton.focus({preventScroll:true});
  });
})();
</script>
